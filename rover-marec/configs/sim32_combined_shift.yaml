# Task 2 preset: terrain + sensor + dynamics shifts together.
# TRUE simulator parameters; the rover never sees them (see docs/OBSERVATION_SCHEMA_V2.md).
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.35
  p_sand: 0.25
  p_rock: 0.22
  gen_corr: 3
  energy_cost: [1, 4, 6]
  slip_prob: [0.06, 0.25, 0.15]
  sensor_miss: 0.2
  sensor_false: 0.08
  sensor_sigma: 0.15
run: {seed: 0, episodes: 1500, out_dir: results/sim32_combined_shift}
