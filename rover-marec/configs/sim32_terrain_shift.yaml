# Task 2 preset: terrain-composition shift: more sand/rock/obstacles, larger patches.
# TRUE simulator parameters; the rover never sees them (see docs/OBSERVATION_SCHEMA_V2.md).
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.35
  p_sand: 0.25
  p_rock: 0.22
  gen_corr: 3
  energy_cost: [1, 3, 5]
  slip_prob: [0.02, 0.1, 0.05]
  sensor_miss: 0.05
  sensor_false: 0.02
  sensor_sigma: 0.05
run: {seed: 0, episodes: 1500, out_dir: results/sim32_terrain_shift}
