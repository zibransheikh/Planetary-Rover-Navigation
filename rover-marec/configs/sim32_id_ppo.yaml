# Task 3: in-distribution env + the PPO settings from the Task-1 fix, carried over UNCHANGED (not retuned for 32x32).
# A 1-seed probe on validation maps showed entropy_coef in {0.01, 0.003, 0.0} all end at 0.92-0.93, i.e. indistinguishable.
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.6
  p_sand: 0.15
  p_rock: 0.1
  gen_corr: 2
  energy_cost: [1, 3, 5]
  slip_prob: [0.02, 0.1, 0.05]
  sensor_miss: 0.05
  sensor_false: 0.02
  sensor_sigma: 0.05
ppo: {reward_scale: 0.02, entropy_coef: 0.003}
run: {seed: 0, episodes: 1500, out_dir: results/sim32_id_ppo}
