# Task 2 preset: sensor shift: 4x miss rate, 4x false-detection rate, 3x reading noise.
# TRUE simulator parameters; the rover never sees them (see docs/OBSERVATION_SCHEMA_V2.md).
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.6
  p_sand: 0.15
  p_rock: 0.1
  gen_corr: 2
  energy_cost: [1, 3, 5]
  slip_prob: [0.02, 0.1, 0.05]
  sensor_miss: 0.2
  sensor_false: 0.08
  sensor_sigma: 0.15
run: {seed: 0, episodes: 1500, out_dir: results/sim32_sensor_shift}
